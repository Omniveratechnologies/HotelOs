name: "HotelOS CodeQL Config"

# Disable default queries and use custom suite
disable-default-queries: false

queries:
  - uses: security-extended
  - uses: security-and-quality

# Custom queries for HotelOS-specific patterns
paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.test.js"
  - "**/*.spec.js"
  - "**/load-tests/**"
  - "**/scripts/**"
  - "**/docs/**"
  - "**/*.md"
  - "**/coverage/**"
  - "**/.next/**"
  - "**/.turbo/**"

# Custom query packs for Node.js/Express security
packs:
  - codeql/javascript-queries@latest

# Severity thresholds
severity-thresholds:
  error: "high"
  warning: "medium"
  info: "low"

# Exclude generated files
exclude-generated-code: true

# Paths to analyze
paths:
  - "apps/backend/src"
  - "packages/api/src"
  - "packages/utils/src"